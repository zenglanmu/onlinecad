name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust / WASM engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/acadrust-wasm

      - name: Format
        run: cargo fmt --manifest-path crates/acadrust-wasm/Cargo.toml -- --check

      - name: Lint
        run: cargo clippy --manifest-path crates/acadrust-wasm/Cargo.toml --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --manifest-path crates/acadrust-wasm/Cargo.toml --lib

      # The wasm-bindgen CLI must match the crate version; build-wasm.sh checks this.
      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129

      - name: Build WASM
        run: ./scripts/build-wasm.sh

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: acadrust-wasm
          path: packages/cad-acadrust/wasm/
          retention-days: 7

  node:
    name: TypeScript / app
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Node test suite runs the compiled WebAssembly, so it needs the
      # artifact from the previous job.
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: acadrust-wasm
          path: packages/cad-acadrust/wasm

      - name: Typecheck
        run: npm run typecheck

      - name: Engine integration tests
        run: npm test

      - name: Build web app
        run: npm run build
